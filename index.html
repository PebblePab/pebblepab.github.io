<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="data:,">
  <title>Suomi</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- ЭКРАН 1: главное меню (выбор уровня) -->
  <section id="screen-menu" class="screen">
    <div id="menu-inner">
      <div id="menu-header">
        <h1>Suomi</h1>
        <button class="theme-toggle" title="Тема">🌙</button>
      </div>
      <p id="menu-subtitle">Выбери уровень</p>

      <div id="level-grid"></div>
    </div>
  </section>

  <!-- ЭКРАН 2: меню уровня (выбор режима) -->
  <section id="screen-level" class="screen" hidden>
    <div id="menu-inner">
      <div id="menu-header">
        <button class="back-btn" data-goto="menu" title="В меню">←</button>
        <h1 id="level-title">A0</h1>
        <button class="theme-toggle" title="Тема">🌙</button>
      </div>
      <p id="level-subtitle">Начальный</p>

      <div id="menu-grid">
        <button class="mode-card" data-goto="cards">
          <div class="mode-icon">📇</div>
          <div class="mode-title">Карточки</div>
          <div class="mode-desc">Слова с интервальным повторением</div>
        </button>

        <button class="mode-card" data-goto="reading">
          <div class="mode-icon">📖</div>
          <div class="mode-title">Чтение</div>
          <div class="mode-desc">Короткие тексты с переводом</div>
        </button>

        <button class="mode-card" data-goto="grammar">
          <div class="mode-icon">📐</div>
          <div class="mode-title">Грамматика</div>
          <div class="mode-desc">Правила с примерами и таблицами</div>
        </button>

        <button class="mode-card disabled" disabled>
          <div class="mode-icon">🎧</div>
          <div class="mode-title">Аудирование</div>
          <div class="mode-desc">Скоро</div>
        </button>
      </div>
    </div>
  </section>

  <!-- ЭКРАН 3: карточки -->
  <section id="screen-cards" class="screen" hidden>
    <div id="layout">
      <aside id="sidebar">
        <div class="level-tabs" id="level-tabs-cards"></div>
        <div id="sidebar-header">
          <button class="back-btn" data-goto="menu" title="В меню">←</button>
          <h1 id="cards-level-label">A0</h1>
          <button class="theme-toggle" title="Тема">🌙</button>
        </div>
        <ul id="cat-list" class="content-list"></ul>
      </aside>

      <main id="app">
        <div id="progress-section">
          <div id="progress-bar">
            <div id="progress-fill"></div>
          </div>
          <div id="progress-labels">
            <span id="session-count">Сегодня: 0</span>
            <span id="streak-count">Подряд: 0</span>
          </div>
        </div>

        <div id="card-wrap">
          <div id="card">
            <div id="question">Загрузка...</div>
            <div id="answer" hidden></div>
          </div>
          <div id="feedback"></div>
        </div>

        <div id="input-row">
          <input type="text" id="answer-input" placeholder="Введи по-фински..." autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
          <button id="check-btn">Проверить</button>
        </div>

        <div id="controls">
          <button id="dont-know-btn">Не знаю</button>
        </div>

        <div id="hint">Enter — проверить · ← не знаю · → знаю · Space — ответ</div>
        <div id="stats"></div>
      </main>
    </div>
  </section>

  <!-- ЭКРАН 4: чтение -->
  <section id="screen-reading" class="screen" hidden>
    <div class="content-layout">
      <aside class="content-sidebar">
        <div class="level-tabs" id="level-tabs-reading"></div>
        <div class="content-sidebar-header">
          <button class="back-btn" data-goto="menu" title="В меню">←</button>
          <h1 id="reading-level-label">A0</h1>
          <button class="theme-toggle" title="Тема">🌙</button>
        </div>
        <ul id="text-list" class="content-list"></ul>
      </aside>

      <main class="content-main">
        <div id="reading-empty" class="content-empty">
          <div class="empty-icon">📖</div>
          <p>Выбери текст слева</p>
        </div>

        <article id="reading-article" hidden>
          <header class="article-header">
            <h2 id="article-title"></h2>
            <div id="article-subtitle" class="article-subtitle"></div>
          </header>
          <div id="article-body"></div>
        </article>
      </main>
    </div>
  </section>

  <!-- ЭКРАН 5: грамматика -->
  <section id="screen-grammar" class="screen" hidden>
    <div class="content-layout">
      <aside class="content-sidebar">
        <div class="level-tabs" id="level-tabs-grammar"></div>
        <div class="content-sidebar-header">
          <button class="back-btn" data-goto="menu" title="В меню">←</button>
          <h1 id="grammar-level-label">A0</h1>
          <button class="theme-toggle" title="Тема">🌙</button>
        </div>
        <ul id="grammar-topic-list" class="content-list"></ul>
      </aside>

      <main class="content-main">
        <div id="grammar-empty" class="content-empty">
          <div class="empty-icon">📐</div>
          <p>Выбери тему слева</p>
        </div>

        <article id="grammar-article" hidden>
          <header class="article-header">
            <h2 id="grammar-title"></h2>
            <div id="grammar-subtitle" class="article-subtitle"></div>
          </header>
          <div id="grammar-body"></div>
        </article>
      </main>
    </div>
  </section>

  <script src="levels.js"></script>
  <script src="app.js"></script>
  <script src="reading.js"></script>
  <script src="grammar.js"></script>
</body>
</html>
