<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Source+Sans+3:wght@400;600&display=swap">
<style>
/* Layout: sticky toolbar over category-grouped tables; same data drives table modes and a flashcard deck. */
:root{
  --bg:#f3f6f9; --surface:#ffffff; --ink:#14243a; --muted:#5d6f86; --line:#d9e1ea;
  --accent:#1f5fa8; --accent-ink:#ffffff; --known:#2f7d4f; --known-bg:#e4f2ea; --hide:#e8eef5;
  --f-display:'Bricolage Grotesque','Segoe UI',system-ui,sans-serif;
  --f-body:'Source Sans 3','Segoe UI',system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1824; --surface:#16222f; --ink:#e6edf5; --muted:#92a3b8; --line:#26364a;
  --accent:#6aa8ee; --accent-ink:#0f1824; --known:#6cc28f; --known-bg:#173326; --hide:#22344a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1824; --surface:#16222f; --ink:#e6edf5; --muted:#92a3b8; --line:#26364a;
  --accent:#6aa8ee; --accent-ink:#0f1824; --known:#6cc28f; --known-bg:#173326; --hide:#22344a; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.4;
  padding-block:0 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:860px;margin:0 auto}
header{padding-top:20px;display:flex;flex-wrap:wrap;gap:8px 24px;align-items:end;justify-content:space-between}
h1{font-family:var(--f-display);font-size:clamp(1.6rem,4vw,2.2rem);margin:0;letter-spacing:-.01em;text-wrap:balance}
.prog{min-width:200px;flex:1 1 200px;max-width:320px;font-size:.9rem;color:var(--muted)}
.bar{height:8px;background:var(--hide);border-radius:4px;margin-top:6px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--known);width:0;transition:width .3s}
.tools{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:12px;margin-top:8px;
  display:flex;flex-direction:column;gap:8px;border-bottom:1px solid var(--line)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface);max-width:100%}
.seg button{border:0;background:none;color:var(--ink);font:inherit;font-size:.9rem;padding:7px 12px;cursor:pointer;border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);font-weight:600}
input[type=search],select{font:inherit;font-size:.95rem;padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);min-width:0}
input[type=search]{flex:1 1 150px}select{flex:1 1 160px;max-width:100%}
.btn{font:inherit;font-size:.9rem;padding:7px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);cursor:pointer}
.btn[aria-pressed="true"]{border-color:var(--accent);color:var(--accent);font-weight:600}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.count{font-size:.85rem;color:var(--muted)}
.tablebox{overflow-x:auto;margin-top:16px}
table{width:100%;border-collapse:collapse;background:var(--surface);border:1px solid var(--line);border-radius:8px}
caption{text-align:left}
tr.cat th{font-family:var(--f-display);text-align:left;padding:18px 12px 8px;font-size:1.05rem;background:var(--bg);border:0}
tr.cat th span{color:var(--muted);font-family:var(--f-body);font-size:.85rem;font-weight:400;margin-left:8px}
td{padding:9px 12px;border-top:1px solid var(--line);vertical-align:middle}
td.fi{font-size:1.15rem;font-weight:600;width:42%}
td.ru{width:48%}
td.ck{width:10%;text-align:center}
tr.known td.fi,tr.known td.ru{color:var(--known)}
tr.known td{background:var(--known-bg)}
.hid{display:inline-block;width:100%;text-align:left;border:0;background:var(--hide);color:var(--muted);font:inherit;font-size:.85rem;padding:5px 10px;border-radius:6px;cursor:pointer}
input[type=checkbox]{width:22px;height:22px;accent-color:var(--known);cursor:pointer}
.empty{padding:40px 12px;text-align:center;color:var(--muted)}
/* flashcards */
.deck{margin-top:20px;display:flex;flex-direction:column;align-items:center;gap:14px}
.card{width:100%;max-width:520px;min-height:240px;background:var(--surface);border:1px solid var(--line);border-radius:14px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:24px;text-align:center;cursor:pointer;font:inherit;color:var(--ink)}
.card .w{font-family:var(--f-display);font-size:clamp(1.8rem,7vw,2.6rem);font-weight:700;text-wrap:balance;overflow-wrap:anywhere}
.card .hint{color:var(--muted);font-size:.85rem}
.card .tag{font-size:.8rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.card.back{border-color:var(--accent)}
.act{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.act .btn{min-width:130px}
.btn.good{background:var(--known);color:var(--accent-ink);border-color:var(--known);font-weight:600}
@media (max-width:520px){td{padding:8px 8px}td.fi{font-size:1.05rem}.seg button{padding:7px 9px}}
@media (prefers-reduced-motion:reduce){.bar i{transition:none}}
</style>

const LS='fi-vocab-known-v1';
let known=new Set();
try{known=new Set(JSON.parse(localStorage.getItem(LS)||'[]'))}catch(e){}
const save=()=>{try{localStorage.setItem(LS,JSON.stringify([...known]))}catch(e){}};
const S={level:'all',mode:'both',cat:'',q:'',unk:false,shuf:false,order:null,open:new Set(),idx:0,flip:false};
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function pool(){return DATA.filter(w=>S.level==='all'||w.lvl===S.level)}
function filtered(){
  const q=S.q.trim().toLowerCase();
  let r=pool().filter(w=>(!S.cat||w.cat===S.cat)&&(!S.unk||!known.has(w.k))&&(!q||w.fi.toLowerCase().includes(q)||w.ru.toLowerCase().includes(q)));
  if(S.shuf&&S.order){const o=S.order;r=r.slice().sort((a,b)=>o[a.k]-o[b.k])}
  return r;
}
function fillCats(){
  const cats=[...new Set(pool().map(w=>w.cat))];
  if(!cats.includes(S.cat))S.cat='';
  $('#cat').innerHTML='<option value="">Все темы</option>'+cats.map(c=>`<option${c===S.cat?' selected':''}>${esc(c)}</option>`).join('');
}
function progress(){
  const p=pool(),n=p.filter(w=>known.has(w.k)).length;
  $('#progText').textContent=`Выучено ${n} из ${p.length}`;
  $('#progBar').style.width=(p.length?n/p.length*100:0)+'%';
}
function cell(w,side){
  const hidden=(side==='ru'&&S.mode==='hideRu')||(side==='fi'&&S.mode==='hideFi');
  const t=esc(w[side]);
  if(hidden&&!S.open.has(w.k))return `<button class="hid" data-k="${esc(w.k)}" aria-label="Показать перевод">показать</button>`;
  return t;
}
function render(){
  progress();
  const list=filtered();
  $('#count').textContent=`Показано слов: ${list.length}`;
  const out=$('#out');
  if(S.mode==='cards'){return renderCards(list,out)}
  if(!list.length){out.innerHTML='<div class="empty">Ничего не найдено. Измени поиск или фильтры.</div>';return}
  let html='<div class="tablebox"><table><thead class="sr" hidden></thead><tbody>';
  const row=w=>`<tr class="${known.has(w.k)?'known':''}"><td class="fi">${cell(w,'fi')}</td><td class="ru">${cell(w,'ru')}</td><td class="ck"><input type="checkbox" data-k="${esc(w.k)}" ${known.has(w.k)?'checked':''} aria-label="Выучено: ${esc(w.fi)}"></td></tr>`;
  if(S.shuf){html+=list.map(row).join('')}
  else{
    const g=new Map();list.forEach(w=>{const key=w.lvl+'|'+w.cat;if(!g.has(key))g.set(key,[]);g.get(key).push(w)});
    g.forEach((ws,key)=>{
      const lv=key.split('|')[0].toUpperCase(),kn=ws.filter(w=>known.has(w.k)).length;
      html+=`<tr class="cat"><th colspan="3">${esc(ws[0].cat)}<span>${S.level==='all'?lv+' · ':''}${kn}/${ws.length}</span></th></tr>`+ws.map(row).join('');
    });
  }
  out.innerHTML=html+'</tbody></table></div>';
}
function renderCards(list,out){
  if(!list.length){out.innerHTML='<div class="empty">Нет слов для карточек. Измени фильтры.</div>';return}
  if(S.idx>=list.length)S.idx=0;
  const w=list[S.idx];
  const front=w.fi, back=w.ru;
  out.innerHTML=`<div class="deck"><div class="count">${S.idx+1} / ${list.length}</div>
  <button class="card${S.flip?' back':''}" id="card" aria-label="Перевернуть карточку">
    <span class="tag">${S.flip?'Русский':'Suomi'}</span>
    <span class="w">${esc(S.flip?back:front)}</span>
    <span class="hint">${esc(w.cat)} · нажми, чтобы перевернуть</span></button>
  <div class="act"><button class="btn" data-a="prev">Назад</button><button class="btn" data-a="again">Ещё раз</button><button class="btn good" data-a="know">Знаю</button></div></div>`;
}
document.addEventListener('click',e=>{
  const t=e.target;
  const seg=t.closest('.seg button');
  if(seg){
    const p=seg.parentElement;p.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',b===seg));
    if(p.id==='segLevel'){S.level=seg.dataset.v;S.cat='';fillCats()} else {S.mode=seg.dataset.v;S.open.clear()}
    S.idx=0;S.flip=false;render();return}
  if(t.id==='unk'){S.unk=!S.unk;t.setAttribute('aria-pressed',S.unk);S.idx=0;render();return}
  if(t.id==='shuf'){S.shuf=!S.shuf;t.setAttribute('aria-pressed',S.shuf);t.textContent=S.shuf?'Порядок по темам':'Перемешать';
    if(S.shuf){S.order={};DATA.forEach(w=>S.order[w.k]=Math.random())}S.idx=0;render();return}
  if(t.id==='reveal'){S.open.clear();if(S.mode==='hideRu'||S.mode==='hideFi'){pool().forEach(w=>S.open.add(w.k))}render();return}
  if(t.classList.contains('hid')){S.open.add(t.dataset.k);render();return}
  if(t.closest('#card')){S.flip=!S.flip;render();return}
  const a=t.dataset&&t.dataset.a;
  if(a){
    const list=filtered(),w=list[S.idx];
    if(a==='prev'){S.idx=(S.idx-1+list.length)%list.length}
    else{if(a==='know')known.add(w.k);else known.delete(w.k);save();
      if(a==='know'&&S.unk){/* word leaves the deck; index now points to the next one */}else S.idx=(S.idx+1)%list.length}
    S.flip=false;render();return}
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.type==='checkbox'&&t.dataset.k){t.checked?known.add(t.dataset.k):known.delete(t.dataset.k);save();render()}
  if(t.id==='cat'){S.cat=t.value;S.idx=0;render()}
});
$('#q').addEventListener('input',e=>{S.q=e.target.value;S.idx=0;render()});
document.addEventListener('keydown',e=>{
  if(S.mode!=='cards'||/INPUT|SELECT/.test(document.activeElement.tagName))return;
  if(e.key===' '||e.key==='Enter'){if(document.activeElement.id==='card')return;e.preventDefault();S.flip=!S.flip;render()}
  if(e.key==='ArrowRight'){const l=filtered();S.idx=(S.idx+1)%l.length;S.flip=false;render()}
  if(e.key==='ArrowLeft'){const l=filtered();S.idx=(S.idx-1+l.length)%l.length;S.flip=false;render()}
});
fillCats();render();
</script>
